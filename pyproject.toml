[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhd-bearings-catalog"
version = "1.0.0"
description = "Professional bearing catalog generator with SEO and LLM optimization"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "RHD Bearings", email = "sales@rhdenterprise.in"}
]
keywords = ["bearings", "catalog", "generator", "seo", "manufacturing", "industrial"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://rhdbearings.com"
Repository = "https://rhdbearings.com"
"Bug Reports" = "https://rhdbearings.com/contact"

[project.scripts]
rhd-bearings = "rhd_bearings.cli:main"

[tool.black]
line-length = 100
target-version = ['py37']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
