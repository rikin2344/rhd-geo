<script>
// Auto-highlight current page in navigation
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = document.body.getAttribute('data-page');
    if (currentPage) {
        const menuLink = document.querySelector(`[data-page="${currentPage}"]`);
        if (menuLink) {
            menuLink.classList.add('current-menu-item');
        }
    }

    // Mobile menu functionality
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const mobileCloseBtn = document.getElementById('mobile-close-btn');
    const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
    const body = document.body;

    // Open mobile menu
    function openMobileMenu() {
        mobileMenuOverlay.classList.add('active');
        hamburgerBtn.classList.add('active');
        body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    // Close mobile menu
    function closeMobileMenu() {
        mobileMenuOverlay.classList.remove('active');
        hamburgerBtn.classList.remove('active');
        body.style.overflow = ''; // Restore scrolling
    }

    // Event listeners
    if (hamburgerBtn) {
        hamburgerBtn.addEventListener('click', openMobileMenu);
    }

    if (mobileCloseBtn) {
        mobileCloseBtn.addEventListener('click', closeMobileMenu);
    }

    // Close menu when clicking overlay background
    if (mobileMenuOverlay) {
        mobileMenuOverlay.addEventListener('click', function(e) {
            if (e.target === mobileMenuOverlay) {
                closeMobileMenu();
            }
        });
    }

    // Mobile submenu toggle
    const mobileMenuToggles = document.querySelectorAll('.mobile-menu-toggle');
    mobileMenuToggles.forEach(toggle => {
        toggle.addEventListener('click', function() {
            const submenu = this.nextElementSibling;
            const arrow = this.querySelector('.mobile-arrow');
            const isOpen = submenu.classList.contains('open');

            // Close all other submenus
            document.querySelectorAll('.mobile-submenu').forEach(sub => {
                sub.classList.remove('open');
            });
            document.querySelectorAll('.mobile-arrow').forEach(arr => {
                arr.textContent = '▼';
            });

            // Toggle current submenu
            if (!isOpen) {
                submenu.classList.add('open');
                arrow.textContent = '▲';
            }
        });
    });

    // Close mobile menu on window resize to desktop
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            closeMobileMenu();
        }
    });
});
</script>
